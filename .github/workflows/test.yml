name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install native GPIO library
        run: sudo ./scripts/install-native-gpio.sh

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Dependencies
        run: |
          make dev-deps

      - name: Run Tests
        run: |
          make pytest

      - name: Coverage
        if: ${{ matrix.python == '3.13' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install coveralls
          coveralls --service=github

  debian-trixie:
    name: Debian Trixie (mocked hardware)
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Python tooling
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes ca-certificates build-essential git python3 python3-dev python3-pip python3-venv swig

      - name: Build, install and test in a virtual environment
        run: ./tests/debian_smoke.sh
